<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="#F8FAFC" />

  <!-- Smartphone / Interactive App Mockup -->
  <g transform="translate(170, 20)" filter="url(#phoneShadow)">
    <!-- Phone Outer Case -->
    <rect x="0" y="0" width="260" height="280" rx="28" fill="url(#phoneBg)" stroke="#334155" stroke-width="2.5" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="95" y="8" width="70" height="8" rx="4" fill="#000000" />

    <!-- Phone Screen -->
    <rect x="10" y="24" width="240" height="244" rx="20" fill="#FFFFFF" />

    <!-- App Header -->
    <rect x="10" y="24" width="240" height="42" rx="20" fill="url(#primaryCard)" />
    <text x="30" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Ruang Belajar Digital</text>
    <circle cx="225" cy="45" r="9" fill="#818CF8" />

    <!-- User Profile & Progress Banner -->
    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="212" height="46" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="12" y="18" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#3730A3">BAB II: Multimedia</text>
      <!-- Progress Bar Container -->
      <rect x="12" y="26" width="130" height="7" rx="3.5" fill="#C7D2FE" />
      <rect x="12" y="26" width="95" height="7" rx="3.5" fill="#4F46E5" />
      <text x="150" y="32" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#4F46E5">75% Selesai</text>
    </g>

    <!-- Interactive Options / Action Buttons -->
    <!-- Button 1: Pilih Topik -->
    <g transform="translate(24, 130)">
      <rect x="0" y="0" width="212" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <circle cx="16" cy="17" r="7" fill="#60A5FA" />
      <text x="32" y="21" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1E293B">Pilih Topik Materi</text>
      <text x="195" y="21" font-family="sans-serif" font-size="10" fill="#64748B">›</text>
    </g>

    <!-- Button 2: Mulai Kuis Interaktif (Active Accent) -->
    <g transform="translate(24, 172)">
      <rect x="0" y="0" width="212" height="36" rx="8" fill="url(#accentBtn)" />
      <polygon points="12,12 24,18 12,24" fill="#FFFFFF" />
      <text x="34" y="22" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF">Mulai Kuis Interaktif</text>
      <text x="175" y="22" font-family="sans-serif" font-size="8" font-weight="bold" fill="#D1FAE5">Skor: 100</text>
    </g>

    <!-- Interactive Navigation Bar Bottom -->
    <g transform="translate(10, 230)">
      <line x1="0" y1="0" x2="240" y2="0" stroke="#F1F5F9" stroke-width="1.5" />
      <circle cx="50" cy="18" r="6" fill="#4F46E5" />
      <circle cx="120" cy="18" r="6" fill="#94A3B8" />
      <circle cx="190" cy="18" r="6" fill="#94A3B8" />
    </g>
  </g>

  <!-- Banner Tag at Bottom -->
  <g transform="translate(145, 312)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#4F46E5" opacity="0.1" stroke="#4F46E5" stroke-width="1.5" />
    <text x="155" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">
      Karakteristik: Interaktif (Pilih Menu, Kuis &amp; Respon)
    </text>
  </g>
</svg>
