<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="videoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="#F8FAFC" />

  <!-- Video Player Container -->
  <g transform="translate(60, 25)" filter="url(#videoShadow)">
    <!-- Video Player Frame -->
    <rect x="0" y="0" width="480" height="265" rx="16" fill="url(#screenBg)" stroke="#334155" stroke-width="2" />

    <!-- Video Stage / Viewport -->
    <!-- Element 1: Gambar / Visual Diagram (Left Center) -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="130" height="95" rx="8" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="65" cy="40" r="20" fill="#0284C7" />
      <path d="M 25 80 L 55 55 L 85 80 Z" fill="#38BDF8" />
      <path d="M 70 80 L 95 60 L 120 80 Z" fill="#7DD3FC" />
      <!-- Pointer Tag 1 -->
      <rect x="15" y="-14" width="100" height="20" rx="10" fill="#0284C7" />
      <text x="65" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">① ELEMEN GAMBAR</text>
    </g>

    <!-- Element 2: Animasi Dinamis / Grafik Bergerak (Right Center) -->
    <g transform="translate(295, 35)">
      <rect x="0" y="0" width="150" height="95" rx="8" fill="#334155" stroke="#F43F5E" stroke-width="1.5" />
      <!-- Animated rotating gear / moving elements representation -->
      <circle cx="75" cy="48" r="24" fill="none" stroke="#FB7185" stroke-width="6" stroke-dasharray="12,6" />
      <circle cx="75" cy="48" r="10" fill="#F43F5E" />
      <path d="M 40 48 L 50 48 M 100 48 L 110 48" stroke="#FDA4AF" stroke-width="3" />
      <!-- Pointer Tag 2 -->
      <rect x="20" y="-14" width="110" height="20" rx="10" fill="#E11D48" />
      <text x="75" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">② ELEMEN ANIMASI</text>
    </g>

    <!-- Element 3: Audio Narasi & Musik Latar (Center Waves) -->
    <g transform="translate(170, 75)">
      <rect x="0" y="0" width="115" height="55" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <!-- Sound wave bars -->
      <line x1="20" y1="28" x2="20" y2="42" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
      <line x1="32" y1="20" x2="32" y2="50" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
      <line x1="44" y1="14" x2="44" y2="56" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />
      <line x1="56" y1="22" x2="56" y2="48" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
      <line x1="68" y1="16" x2="68" y2="54" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />
      <line x1="80" y1="24" x2="80" y2="46" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
      <line x1="92" y1="30" x2="92" y2="40" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
      <!-- Pointer Tag 3 -->
      <rect x="8" y="-14" width="100" height="20" rx="10" fill="#059669" />
      <text x="58" y="0" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">③ ELEMEN AUDIO</text>
    </g>

    <!-- Element 4: Teks Subtitle / Penjelasan (Bottom Stage) -->
    <g transform="translate(50, 160)">
      <rect x="0" y="0" width="380" height="40" rx="8" fill="#000000" opacity="0.75" stroke="#F59E0B" stroke-width="1.5" />
      <text x="190" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FEF08A" text-anchor="middle">
        "Multimedia menggabungkan berbagai media secara harmonis."
      </text>
      <!-- Pointer Tag 4 -->
      <rect x="135" y="-13" width="110" height="18" rx="9" fill="#D97706" />
      <text x="190" y="0" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">④ ELEMEN TEKS</text>
    </g>

    <!-- Player Progress Bar & Controls -->
    <g transform="translate(25, 230)">
      <line x1="0" y1="0" x2="430" y2="0" stroke="#475569" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="0" x2="210" y2="0" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
      <circle cx="210" cy="0" r="6" fill="#60A5FA" />
      <!-- Play Button Icon -->
      <polygon points="5,15 15,22 5,29" fill="#94A3B8" />
      <text x="30" y="25" font-family="sans-serif" font-size="10" fill="#94A3B8">04:12 / 10:00</text>
      <text x="400" y="25" font-family="sans-serif" font-size="10" fill="#94A3B8">HD 1080p</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(130, 312)">
    <rect x="0" y="0" width="340" height="32" rx="16" fill="#0284C7" opacity="0.1" stroke="#0284C7" stroke-width="1.5" />
    <text x="170" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">
      Stimulus Video Pembelajaran: 4 Elemen Multimedia Terpadu
    </text>
  </g>
</svg>
